<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIGEA | Artificial Intelligence Governance & Ethics Agency</title>
  <style>
    @font-face {
      font-family: 'Trajan Pro';
      src: url('TrajanPro-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Trajan Pro';
      src: url('TrajanPro-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    @font-face {
      font-family: 'Inter';
      src: url('Inter-Regular.woff2') format('woff2');
      font-weight: 400;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      background-color: #FAF9F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    #word {
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #131313;
      user-select: none;
      text-align: center;
    }

    #word span {
      display: inline-block;
      white-space: pre;
      transition: color 0.6s ease;
    }

    #logo-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    #logo-frame {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    #color-blocks {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      align-self: center;
      transform: translateY(-1px);
    }

    .color-block {
      width: 13px;
      height: 4.3px;
    }

    #logo-text {
      display: flex;
      align-items: baseline;
      gap: 2px;
    }

    #aigea-text {
      font-family: 'Trajan Pro', serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #626262;
      user-select: none;
      line-height: 1;
    }

    #aigea-text span {
      display: inline-block;
    }

    #dot-org-text {
      font-family: 'Trajan Pro', serif;
      font-size: 7px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #626262;
      user-select: none;
      line-height: 1;
    }

    #dot-org-text span {
      display: inline-block;
    }

    #maintenance-line {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #maintenance-text {
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: -0.01em;
      color: #898988;
      user-select: none;
      white-space: nowrap;
    }

    #lse-logo {
      height: 20px;
      width: auto;
      display: block;
    }

    @media (max-width: 600px) {
      #word {
        font-size: 15px;
      }

      .color-block {
        width: 17px;
        height: 5.6px;
      }

      #aigea-text {
        font-size: 14px;
      }

      #dot-org-text {
        font-size: 9px;
      }

      #maintenance-text {
        font-size: 11px;
      }

      #lse-logo {
        height: 27px;
      }
    }
  </style>
</head>
<body>

  <p id="word"></p>

  <div id="logo-wrapper">
    <div id="logo-frame">
      <div id="color-blocks">
        <div class="color-block" style="background:#3047b6;"></div>
        <div class="color-block" style="background:#4766b4;"></div>
        <div class="color-block" style="background:#898dd1;"></div>
      </div>
      <div id="logo-text">
        <p id="aigea-text"></p>
        <p id="dot-org-text"></p>
      </div>
    </div>

    <div id="maintenance-line">
      <span id="maintenance-text">Currently under maintenance, being advised by</span>
      <img id="lse-logo" src="London_school_of_economics_logo_with_name.png" alt="London School of Economics" />
    </div>
  </div>

  <script>
    const COLORS       = ['#3047B6', '#4766B4', '#898DD1', '#131313'];
    const WORDS        = ['Artificial Intelligence Governance & Ethics Agency'];
    const CHARS_LOWER  = 'abcdefghijklmnopqrstuvwxyz';
    const CHARS_UPPER  = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const DISPLAY_TIME = 3500;
    const COLOR_DELAY  = 70;

    const wordEl        = document.getElementById('word');
    const logoWrapperEl = document.getElementById('logo-wrapper');
    const aigeaEl       = document.getElementById('aigea-text');
    const dotOrgEl      = document.getElementById('dot-org-text');
    const maintenanceEl = document.getElementById('maintenance-line');

    let wordSpans   = [];
    let aigeaSpans  = [];
    let dotOrgSpans = [];
    let colorTimer  = null;

    // ── helpers ───────────────────────────────────────────────────────────────

    function rndChar(upper) {
      const pool = upper ? CHARS_UPPER : CHARS_LOWER;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function adjustSpans(parent, arr, n) {
      while (arr.length < n) {
        const s = document.createElement('span');
        parent.appendChild(s);
        arr.push(s);
      }
      while (arr.length > n) {
        parent.removeChild(arr.pop());
      }
    }

    function stopColor() {
      clearTimeout(colorTimer);
      colorTimer = null;
    }

    function startColor(arr) {
      stopColor();
      function cycle(idx) {
        const color = COLORS[idx % COLORS.length];
        arr.forEach((s, i) => {
          setTimeout(() => { if (s.parentNode) s.style.color = color; }, i * COLOR_DELAY);
        });
        colorTimer = setTimeout(() => cycle(idx + 1), arr.length * COLOR_DELAY + 700);
      }
      cycle(0);
    }

    // Scrambles parent/arr to target text; upper = uppercase char pool; fixedColor = don't animate color
    function scramble(parent, arr, target, upper, fixedColor) {
      return new Promise(resolve => {
        adjustSpans(parent, arr, target.length);

        const resetColor = fixedColor || '#131313';
        arr.forEach(s => { s.style.transition = 'none'; s.style.color = resetColor; });
        requestAnimationFrame(() => {
          if (!fixedColor) arr.forEach(s => s.style.transition = 'color 0.6s ease');
        });

        const FRAME   = 45;
        const LEAD    = 380;
        const STAGGER = Math.min(75, 1800 / Math.max(target.length, 1));

        const locked = new Array(target.length).fill(false);
        let done = 0;

        arr.forEach(s => { s.textContent = rndChar(upper); });

        const iv = setInterval(() => {
          arr.forEach((s, i) => { if (!locked[i]) s.textContent = rndChar(upper); });
        }, FRAME);

        target.split('').forEach((ch, i) => {
          setTimeout(() => {
            locked[i] = true;
            arr[i].textContent = ch === ' ' ? ' ' : ch;
            if (++done === target.length) { clearInterval(iv); resolve(); }
          }, LEAD + i * STAGGER);
        });
      });
    }

    // ── show / hide ───────────────────────────────────────────────────────────

    function showWord() {
      maintenanceEl.style.opacity = '0';
      logoWrapperEl.style.display = 'none';
      wordEl.style.display        = 'block';
    }

    function showLogo() {
      wordEl.style.display        = 'none';
      logoWrapperEl.style.display = 'flex';
    }

    // ── animations ────────────────────────────────────────────────────────────

    async function animateWord(text) {
      stopColor();
      showWord();
      await scramble(wordEl, wordSpans, text, false);
      startColor(wordSpans);
    }

    async function animateLogo() {
      stopColor();
      showLogo();

      // Both scramble with uppercase Trajan pool, color stays fixed at #626262
      const aigeaDone  = scramble(aigeaEl, aigeaSpans, 'AIGEA', true, '#626262');
      const dotOrgDone = new Promise(res => {
        setTimeout(async () => { await scramble(dotOrgEl, dotOrgSpans, '.org', true, '#626262'); res(); }, 150);
      });

      await Promise.all([aigeaDone, dotOrgDone]);
      // No color animation — logo stays #626262

      maintenanceEl.style.opacity = '1';
    }

    // ── main loop ─────────────────────────────────────────────────────────────

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function run() {
      await animateWord(WORDS[0]);
      await wait(DISPLAY_TIME);
      await animateLogo();
    }

    setTimeout(run, 600);
  </script>
</body>
</html>
