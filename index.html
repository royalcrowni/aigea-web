<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aigea</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0805;
    }

    /* ── Canvas de lava lamp ── */
    #lava-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      filter: blur(70px) saturate(1.6);
      opacity: 0.55;
    }

    /* ── Capa de grano ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.035;
      pointer-events: none;
    }

    /* ── Logo centrado ── */
    .logo-wrap {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-wrap svg {
      width: clamp(260px, 52vw, 780px);
      height: auto;
      filter:
        drop-shadow(0 0 28px rgba(188, 161, 98, 0.45))
        drop-shadow(0 0 80px rgba(188, 161, 98, 0.18));
      animation: logoBreath 5s ease-in-out infinite;
    }

    @keyframes logoBreath {
      0%, 100% { filter: drop-shadow(0 0 28px rgba(188,161,98,0.45)) drop-shadow(0 0 80px rgba(188,161,98,0.18)); }
      50%       { filter: drop-shadow(0 0 42px rgba(210,178,110,0.65)) drop-shadow(0 0 120px rgba(188,161,98,0.28)); }
    }

    /* ── Footer contact ── */
    .footer {
      position: fixed;
      bottom: 32px;
      left: 0;
      width: 100%;
      z-index: 20;
      display: flex;
      justify-content: center;
    }

    .footer a {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: clamp(11px, 1.2vw, 14px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(188, 161, 98, 0.5);
      text-decoration: none;
      transition: color 0.4s ease, letter-spacing 0.4s ease;
    }

    .footer a:hover {
      color: rgba(210, 178, 110, 0.9);
      letter-spacing: 0.38em;
    }
  </style>
</head>
<body>

  <canvas id="lava-canvas"></canvas>

  <!-- Footer -->
  <footer class="footer">
    <a href="mailto:contact@aigea.org">Contact</a>
  </footer>

  <script>
    const canvas = document.getElementById('lava-canvas');
    const ctx = canvas.getContext('2d');

    // Paleta dorada oscura tipo lámpara de lava
    const COLORS = [
      { r: 188, g: 130, b: 30  },
      { r: 210, g: 155, b: 50  },
      { r: 160, g: 100, b: 20  },
      { r: 230, g: 175, b: 70  },
      { r: 120, g:  75, b: 10  },
      { r: 200, g: 145, b: 40  },
      { r: 170, g: 120, b: 30  },
    ];

    let W, H, blobs;

    function rand(min, max) { return min + Math.random() * (max - min); }

    class Blob {
      constructor() { this.reset(true); }
      reset(init) {
        this.x  = rand(0, W);
        this.y  = init ? rand(0, H) : (Math.random() < 0.5 ? -120 : H + 120);
        this.r  = rand(W * 0.08, W * 0.22);
        this.vx = rand(-0.35, 0.35);
        this.vy = rand(-0.5, 0.5) * (Math.random() < 0.5 ? 1 : -1);
        // Velocidad vertical muy lenta = efecto lámpara
        if (Math.abs(this.vy) < 0.15) this.vy = 0.15 * Math.sign(this.vy) || 0.15;
        this.color   = COLORS[Math.floor(Math.random() * COLORS.length)];
        this.phase   = rand(0, Math.PI * 2);
        this.wobbleAmp   = rand(0.015, 0.04);
        this.wobbleSpeed = rand(0.008, 0.018);
        this.morphAmp    = rand(0.06, 0.18);
        this.morphSpeed  = rand(0.006, 0.014);
        this.morphOffset = rand(0, Math.PI * 2);
        this.alpha = rand(0.55, 0.9);
      }
      update(t) {
        this.x += this.vx + Math.sin(t * this.wobbleSpeed + this.phase) * this.wobbleAmp * 2;
        this.y += this.vy;
        // Wrap horizontal
        if (this.x < -this.r * 2) this.x = W + this.r;
        if (this.x > W + this.r * 2) this.x = -this.r;
        // Rebote vertical suave (lámpara)
        if (this.y < -this.r * 2 || this.y > H + this.r * 2) this.reset(false);
      }
      draw(t) {
        const pts = 7 + Math.floor(rand(0, 4));
        ctx.beginPath();
        for (let i = 0; i <= pts; i++) {
          const angle = (i / pts) * Math.PI * 2;
          const wobble = 1 + this.morphAmp * Math.sin(angle * 3 + t * this.morphSpeed + this.morphOffset)
                           + this.morphAmp * 0.5 * Math.cos(angle * 5 - t * this.morphSpeed * 1.3);
          const rx = this.x + Math.cos(angle) * this.r * wobble;
          const ry = this.y + Math.sin(angle) * this.r * wobble * 0.85;
          i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        const { r, g, b } = this.color;
        const grad = ctx.createRadialGradient(
          this.x - this.r * 0.25, this.y - this.r * 0.25, this.r * 0.1,
          this.x, this.y, this.r * 1.1
        );
        grad.addColorStop(0,   `rgba(${r+40},${g+35},${b+20},${this.alpha})`);
        grad.addColorStop(0.5, `rgba(${r},${g},${b},${this.alpha * 0.85})`);
        grad.addColorStop(1,   `rgba(${Math.max(r-40,0)},${Math.max(g-40,0)},${Math.max(b-20,0)},0)`);
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
      const count = Math.min(Math.floor((W * H) / 38000) + 6, 18);
      blobs = Array.from({ length: count }, () => new Blob());
    }

    let t = 0;
    function loop() {
      t += 0.7;
      ctx.clearRect(0, 0, W, H);
      for (const b of blobs) { b.update(t); b.draw(t); }
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resize);
    resize();
    loop();
  </script>
